<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar acesso | DOC4DOCS</title>
  <link rel="icon" type="image/png" href="/doc4docs-favicon.png">
  <link rel="stylesheet" href="/login.css?v=email-1">
  <script src="/password-recovery.js?v=1" defer></script>
</head>
<body data-recovery-view="forgot">
  <main class="loginShell">
    <header class="loginBrand"><img src="/doc4docs-logo-white.png" alt="DOC4DOCS" width="280" height="130"></header>
    <section class="loginPanel" aria-labelledby="recoveryTitle">
      <h1 id="recoveryTitle">Recuperar acesso</h1>
      <form id="recoveryForm">
        <label for="recoveryEmail">E-mail cadastrado</label>
        <input id="recoveryEmail" name="email" type="email" maxlength="254" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        <p id="recoveryError" class="loginError" role="alert"></p>
        <button id="recoverySubmit" type="submit">Enviar link de recuperação</button>
      </form>
      <div id="recoveryResult" class="recoveryResult" role="status" tabindex="-1" hidden><h2>Confira seu e-mail</h2><p id="recoveryMessage"></p></div>
      <p class="recoveryLink"><a href="/login">Voltar para entrar</a></p>
    </section>
  </main>
</body>
</html>
