<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102b25">
  <title>Tarefas · DOC4DOCS</title>
  <link rel="icon" type="image/png" href="/doc4docs-favicon.png?v=20260908-2">
  <link rel="stylesheet" href="/styles.css?v=refresh-all-1">
  <link rel="stylesheet" href="/tasks.css?v=3">
  <link rel="preload" href="/app-shell.js?v=1" as="script">
  <script>
    document.documentElement.classList.add("appShellBooting");
    window.addEventListener("DOMContentLoaded", () => document.documentElement.classList.remove("appShellBooting"), {once:true});
  </script>
  <script src="/session.js?v=tasks1" defer></script>
  <script src="/body-icons.js" defer></script>
  <script src="/clinic-refresh.js?v=automatic-1" defer></script>
  <script src="/tasks.js?v=3" defer></script>
  <link rel="stylesheet" href="/design-system.css?v=1">
</head>
<body class="tasksPage" data-app-page="tasks">
  <div class="sessionToolbar" aria-label="Conta">
    <span id="sessionStatus" role="status"></span>
    <span data-session-user>Conta</span>
    <a href="/master" data-master-only hidden>Master</a>
    <button type="button" data-logout>Sair</button>
  </div>
  <div class="ambient" aria-hidden="true"></div>
  <div class="shell tasksHeader">
    <header class="topbar">
      <div class="topbarBrand">
        <img src="/doc4docs-logo-white.png" alt="DOC4DOCS">
        <div><h1>DOC4DOCS</h1></div>
      </div>
      <div class="actions">
        <button id="changeClinicBtn" class="secondary" type="button">Trocar clínica</button>
        <a id="settingsLink" class="buttonLink secondary" href="/settings.html" data-master-only hidden>Configurações</a>
        <button id="connectBtn" class="secondary" type="button" data-master-only hidden>Conectar Kommo</button>
        <button id="syncBtn" type="button" hidden>
          <i data-lucide="refresh-cw" aria-hidden="true"></i>
          <span data-refresh-label>Atualizar tudo</span>
        </button>
        <p id="clinicEyebrow" class="eyebrow clinicHeaderName">DOC4DOCS</p>
      </div>
    </header>
    <p id="refreshStatus" class="refreshStatus" role="status" hidden></p>
    <button id="mobileTabsToggle" class="mobileTabsToggle" type="button" aria-expanded="false" aria-controls="viewTabs">
      <span>Tarefas</span><span aria-hidden="true">⌄</span>
    </button>
    <nav id="viewTabs" class="viewTabs" aria-label="Áreas do dashboard"></nav>
  </div>
  <main class="tasksContent" aria-label="Gerenciamento de tarefas">
    <div class="page-heading"><div><p class="eyebrow" id="clinicName">DOC4DOCS</p><h1>Tarefas <span id="totalCount" class="count"></span></h1></div><button type="button" class="primary" id="newTask" hidden><i data-lucide="plus"></i> Nova tarefa</button></div>
    <div class="toolbar">
      <div class="segments" role="group" aria-label="Visualização">
        <button type="button" data-mode="board" aria-pressed="true"><i data-lucide="columns-3"></i> Quadro</button>
        <button type="button" data-mode="list" aria-pressed="false"><i data-lucide="list"></i> Lista</button>
        <button type="button" data-mode="calendar" aria-pressed="false"><i data-lucide="calendar-days"></i> Calendário</button>
      </div>
      <label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="Buscar tarefa" aria-label="Buscar tarefa" maxlength="200"></label>
      <label><span class="sr-only">Responsável</span><select id="assigneeFilter" aria-label="Filtrar por responsável"><option value="">Todos os responsáveis</option></select></label>
      <label><span class="sr-only">Prazo</span><select id="dueFilter" aria-label="Filtrar por prazo"><option value="">Todos os prazos</option><option value="today">Vencem hoje</option><option value="overdue">Atrasadas</option><option value="none">Sem prazo</option></select></label>
      <label class="toggle"><input type="checkbox" id="archivedFilter"> Arquivadas</label>
      <button type="button" class="icon-button" id="refresh" title="Atualizar tarefas" aria-label="Atualizar tarefas"><i data-lucide="refresh-cw"></i></button>
    </div>
    <p id="notice" class="notice" role="status" hidden></p>
    <div class="workspace" id="workspace">
      <section class="task-space" aria-label="Tarefas">
        <div id="taskView" aria-busy="true"><p class="empty">Carregando tarefas...</p></div>
        <div class="pagination"><span id="loadedCount"></span><button type="button" id="loadMore" hidden>Carregar mais</button></div>
      </section>
      <aside id="inspector" class="inspector" aria-labelledby="detailHeading" hidden></aside>
    </div>
  </main>
  <div id="toast" role="status" hidden></div>
  <script src="/app-shell.js?v=1"></script>
</body>
</html>
