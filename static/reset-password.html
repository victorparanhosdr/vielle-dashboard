<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nova senha | DOC4DOCS</title>
  <link rel="icon" type="image/png" href="/doc4docs-favicon.png">
  <link rel="stylesheet" href="/login.css?v=email-1">
  <script src="/password-recovery.js?v=1" defer></script>
</head>
<body data-recovery-view="reset">
  <main class="loginShell">
    <header class="loginBrand"><img src="/doc4docs-logo-white.png" alt="DOC4DOCS" width="280" height="130"></header>
    <section class="loginPanel" aria-labelledby="recoveryTitle">
      <h1 id="recoveryTitle">Criar nova senha</h1>
      <form id="recoveryForm">
        <label for="recoveryPassword">Nova senha (mínimo de 12 caracteres)</label>
        <input id="recoveryPassword" name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
        <label for="recoveryConfirmation">Confirmar nova senha</label>
        <input id="recoveryConfirmation" name="password_confirmation" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
        <p id="recoveryError" class="loginError" role="alert"></p>
        <button id="recoverySubmit" type="submit">Salvar nova senha</button>
      </form>
      <div id="recoveryResult" class="recoveryResult" role="status" tabindex="-1" hidden><h2 id="resultTitle">Senha atualizada</h2><p id="recoveryMessage"></p></div>
      <p class="recoveryLink"><a href="/recuperar-senha">Solicitar outro link</a></p>
      <p class="recoveryLink"><a href="/login">Voltar para entrar</a></p>
    </section>
  </main>
</body>
</html>
